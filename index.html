<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAICLO 주문내역 조회 시스템</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'sans-serif'],
            brand: ['Montserrat', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Pretendard', sans-serif; background-color: #f7faf8; color: #064e3b; }
    .badge-logo {
      background-color: #064e3b; color: #fff; border-radius: 9999px; display: inline-flex;
      align-items: center; justify-content: center; letter-spacing: -0.02em; border: 2px solid #047857;
      box-shadow: 0 4px 14px rgba(5, 150, 105, 0.2);
    }
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #a7f3d0; border-radius: 9999px; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #6ee7b7; }
  </style>
</head>
<body class="min-h-screen bg-[#f7faf8] flex flex-col selection:bg-emerald-200 selection:text-emerald-900">

  <header class="bg-white/90 backdrop-blur-md border-b border-emerald-100 sticky top-0 z-30 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 sm:h-20 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button id="headerLogoBtn" type="button" title="홈 화면으로 이동 및 새로고침" aria-label="홈 화면으로 이동 및 새로고침"
          class="badge-logo px-4 py-1.5 sm:px-5 sm:py-2 hover:opacity-90 active:scale-95 transition-all cursor-pointer">
          <div class="flex items-center tracking-wider font-extrabold font-brand text-lg sm:text-2xl text-white select-none">
            <span>D</span>
            <span class="relative mx-[0.5px]">
              <span>A</span>
              <span class="absolute left-1/2 -translate-x-1/2 bottom-[4px] w-[3px] h-[3px] bg-[#064e3b] rounded-full"></span>
            </span>
            <span>ICLO</span>
            <span class="text-[9px] sm:text-[11px] ml-1 font-sans font-bold border border-emerald-300 rounded-full w-3.5 h-3.5 flex items-center justify-center text-emerald-200">R</span>
          </div>
        </button>
        <span class="text-2xl sm:text-3xl font-black text-emerald-900 tracking-tight ml-2">송파헬리오시티점</span>
      </div>

    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8 flex-1 w-full space-y-6 pb-32">
    <div class="bg-gradient-to-br from-emerald-900 via-emerald-800 to-teal-900 rounded-3xl p-6 sm:p-8 text-white shadow-xl relative overflow-hidden border border-emerald-700/40">
      <!-- 닉네임 조회 영역 우측 상단 집모양 홈 리프레시 버튼 -->
      <button id="manualHomeRefreshBtn" type="button" title="홈 화면으로 초기화 및 새로고침" aria-label="홈 화면으로 초기화 및 새로고침"
        class="absolute top-4 sm:top-6 right-4 sm:right-6 z-20 w-10 h-10 sm:w-11 sm:h-11 rounded-2xl bg-white/15 hover:bg-white/25 active:scale-90 text-white border border-white/20 flex items-center justify-center shadow-md backdrop-blur-xs transition-all cursor-pointer">
        <i data-lucide="home" class="w-5 h-5 text-emerald-100 stroke-[2.2]"></i>
      </button>

      <div class="absolute -right-6 -bottom-6 opacity-10 pointer-events-none select-none font-brand font-black text-8xl text-emerald-300">
        DAICLO
      </div>

      <div class="relative z-10 w-full space-y-4">
        <div class="pr-12 sm:pr-14">
          <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight text-white flex flex-wrap items-baseline gap-2">
            <span>주문조회 &amp; 픽업 체크</span>
          </h1>
          <p class="text-sm text-emerald-100/90 leading-relaxed font-normal mt-1">
            닉네임을 조회하시면 주문내역을 확인할 수 있습니다. 픽업시 <strong class="text-emerald-300 font-bold">"픽업"</strong> 버튼을 클릭해주세요.
          </p>
        </div>

        <div class="pt-2 relative space-y-3 w-full">
          <div class="flex items-stretch gap-2 sm:gap-3 w-full">
            <div class="relative flex-1 min-w-0 flex items-center">
              <div class="absolute left-3.5 sm:left-4.5 text-emerald-600/70 pointer-events-none flex items-center">
                <i data-lucide="search" class="w-4 h-4 sm:w-4.5 sm:h-4.5"></i>
              </div>
              <input type="text" id="nicknameSearchInput" placeholder="예) 헬리오1234 / 1234" autocomplete="off"
                class="w-full bg-white text-emerald-950 placeholder:text-emerald-700/45 pl-9 sm:pl-11 pr-9 sm:pr-10 py-3.5 sm:py-4 md:py-4.5 rounded-2xl font-medium text-sm sm:text-base focus:outline-none focus:ring-4 focus:ring-emerald-400/40 shadow-lg">
              <button id="clearSearchBtn" type="button" aria-label="검색어 지우기" class="absolute right-3 text-emerald-600 hover:text-emerald-900 hidden p-1 cursor-pointer">
                <i data-lucide="x" class="w-4 h-4 sm:w-4.5 sm:h-4.5"></i>
              </button>
            </div>
            <button id="searchNicknameBtn" type="button" class="shrink-0 w-16 sm:w-20 md:w-24 flex items-center justify-center gap-1 sm:gap-1.5 bg-emerald-400 hover:bg-emerald-300 active:scale-95 text-emerald-950 font-extrabold text-sm sm:text-base rounded-2xl shadow-lg cursor-pointer border border-emerald-300 transition-all whitespace-nowrap select-none">
              <i data-lucide="search" class="w-4 h-4 sm:w-4.5 sm:h-4.5 stroke-[2.5]"></i>
              <span>조회</span>
            </button>
          </div>

          <!-- 심플하고 정돈된 닉네임 선택/표시 영역 -->
          <div id="matchingChipsContainer" class="hidden pt-1 transition-all">
            <div id="nicknameChipList" class="w-full"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="bg-gradient-to-br from-emerald-900 via-emerald-800 to-teal-900 rounded-3xl border border-emerald-700/50 shadow-xl overflow-hidden min-h-[300px]">
      <div id="ordersListContainer" class="p-4 sm:p-6 space-y-5"></div>

      <div id="initialStatePrompt" class="p-10 sm:p-16 text-center text-emerald-100 flex flex-col items-center justify-center h-full">
        <div class="w-16 h-16 bg-emerald-800/60 rounded-2xl flex items-center justify-center mx-auto mb-4 text-emerald-300 border border-emerald-600/50">
          <i data-lucide="user-search" class="w-8 h-8"></i>
        </div>
        <h3 id="initialPromptTitle" class="text-base sm:text-lg font-bold text-white">주문조회 &amp; 픽업 체크</h3>
        <p id="initialPromptDesc" class="text-xs sm:text-sm text-emerald-200 mt-2 max-w-md mx-auto leading-relaxed">
          상단 검색창에 닉네임을 입력 후 <strong>[조회]</strong>를 누르면 주문 내역이 표시됩니다.
        </p>
      </div>

      <div id="emptyResultsState" class="hidden p-10 sm:p-16 text-center text-emerald-100 flex flex-col items-center justify-center h-full">
        <div class="w-16 h-16 bg-rose-900/40 rounded-2xl flex items-center justify-center mx-auto mb-4 text-rose-300 border border-rose-800/50">
          <i data-lucide="search-x" class="w-8 h-8"></i>
        </div>
        <h3 class="text-base sm:text-lg font-bold text-white">일치하는 닉네임이 없습니다</h3>
        <p class="text-xs sm:text-sm text-emerald-200 mt-2">주문하신 닉네임으로 다시 입력해주세요</p>
        <button id="resetAllFiltersBtn" type="button" class="mt-5 px-5 py-2 bg-emerald-800 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition-all cursor-pointer">
          초기화
        </button>
      </div>
    </div>
  </main>

  <!-- 토스트 알림 -->
  <div id="toastNotification" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 transform translate-y-20 opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-2xl text-white text-sm font-semibold whitespace-nowrap">
    <div id="toastIcon"></div>
    <span id="toastMessage"></span>
  </div>

  <!-- 화면 왼쪽 하단: 갱신 시각 및 컨트롤 버튼 바 -->
  <div class="fixed bottom-4 sm:bottom-6 left-4 sm:left-6 z-40 flex flex-wrap items-center gap-2 sm:gap-2.5 select-none pointer-events-auto max-w-[calc(100vw-2rem)]">
    <!-- 갱신 시각 표시 뱃지 -->
    <button id="systemSyncBtn" type="button" class="px-3.5 py-2.5 bg-white/95 backdrop-blur-md border border-emerald-200/80 rounded-2xl shadow-sm text-emerald-800 hover:bg-emerald-50 active:scale-95 transition-all flex items-center justify-center gap-1.5 cursor-pointer text-xs sm:text-sm font-bold">
      <i data-lucide="refresh-ccw" class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-emerald-600"></i>
      <span class="tracking-tight">DB UPDATE</span>
    </button>
  </div>

  <!-- 비밀번호 입력 모달 -->
  <div id="passwordModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-emerald-950/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden transform scale-95 transition-transform duration-300 p-8 text-center" id="passwordModalContent">
      <div class="w-12 h-12 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center mx-auto mb-4">
        <i data-lucide="lock" class="w-6 h-6"></i>
      </div>
      <h3 class="text-xl font-extrabold text-slate-800 mb-2">관리자 비밀번호</h3>
      <p class="text-xs text-slate-500 mb-6">내역을 확인하려면 비밀번호를 입력해주세요.</p>
      
      <input type="password" id="adminPasswordInput" class="w-full border-2 border-emerald-100 bg-slate-50 rounded-xl p-4 text-center text-2xl tracking-[0.5em] font-mono focus:outline-none focus:border-emerald-500 focus:bg-white transition-colors mb-6" placeholder="****" maxlength="30">
      
      <div class="flex gap-2 justify-center">
        <button id="cancelPasswordBtn" type="button" class="flex-1 px-4 py-3 text-slate-600 bg-slate-100 hover:bg-slate-200 font-bold rounded-xl transition-colors">취소</button>
        <button id="verifyPasswordBtn" type="button" class="flex-1 px-4 py-3 text-white bg-emerald-600 hover:bg-emerald-700 font-bold rounded-xl transition-colors">확인</button>
      </div>
    </div>
  </div>

  <!-- 히스토리 내역 모달 -->
  <div id="historyModal" class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-emerald-950/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl max-h-[88vh] flex flex-col transform scale-95 transition-transform duration-300 border border-emerald-100" id="historyModalContent">
      <div class="p-5 sm:p-6 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-3xl">
        <div class="flex items-center gap-3 text-emerald-800">
          <div class="w-10 h-10 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center shrink-0 border border-emerald-200">
            <i data-lucide="history" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 class="text-lg sm:text-xl font-extrabold text-slate-800 tracking-tight">픽업 처리 내역</h3>
            <p class="text-xs text-slate-500 font-medium mt-0.5">완료 처리된 주문의 상세 정보입니다</p>
          </div>
        </div>
        <button id="closeHistoryBtn" type="button" aria-label="닫기" class="text-slate-400 hover:text-slate-700 hover:bg-slate-200/60 rounded-xl transition-colors p-2 cursor-pointer">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      
      <div class="p-4 sm:p-6 overflow-y-auto flex-1 custom-scroll bg-slate-50/60 rounded-b-3xl">
        <div id="historyListContainer" class="space-y-3.5">
          <!-- 히스토리 렌더링 영역 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 커스텀 안내 팝업(Alert 대체 모달) -->
  <div id="customAlertModal" class="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-emerald-950/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden transform scale-95 transition-transform duration-300 p-8 text-center border border-emerald-100" id="customAlertContent">
      <div class="w-14 h-14 bg-rose-50 text-rose-500 rounded-2xl flex items-center justify-center mx-auto mb-5 border border-rose-100">
        <i data-lucide="alert-circle" class="w-7 h-7"></i>
      </div>
      <h3 class="text-xl font-extrabold text-slate-800 mb-3">안내</h3>
      <p id="customAlertMessage" class="text-sm text-slate-600 mb-8 leading-relaxed font-medium"></p>
      
      <button id="closeAlertBtn" type="button" class="w-full px-4 py-3.5 text-white bg-emerald-600 hover:bg-emerald-700 active:scale-95 font-bold rounded-xl transition-all shadow-md">
        확인
      </button>
    </div>
  </div>

  <!-- 커스텀 확인 팝업(Confirm 대체 모달) -->
  <div id="customConfirmModal" class="fixed inset-0 z-[65] flex items-center justify-center p-4 bg-emerald-950/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-sm overflow-hidden transform scale-95 transition-transform duration-300 p-8 text-center border border-emerald-100" id="customConfirmContent">
      <div class="w-14 h-14 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-amber-100">
        <i data-lucide="help-circle" class="w-7 h-7"></i>
      </div>
      <h3 class="text-xl font-extrabold text-slate-800 mb-2">확인</h3>
      <p id="customConfirmMessage" class="text-xs sm:text-sm text-slate-600 mb-6 leading-relaxed font-medium"></p>
      <div class="flex gap-2">
        <button id="customConfirmCancelBtn" type="button" class="flex-1 px-4 py-3 text-slate-600 bg-slate-100 hover:bg-slate-200 font-bold rounded-xl transition-colors">
          취소
        </button>
        <button id="customConfirmOkBtn" type="button" class="flex-1 px-4 py-3 text-white bg-rose-600 hover:bg-rose-700 active:scale-95 font-bold rounded-xl transition-colors shadow-sm">
          삭제하기
        </button>
      </div>
    </div>
  </div>

  <!-- Apps Script 백그라운드 완벽 실행용 숨김 아이프레임 -->
  <iframe id="appsScriptHiddenTarget" name="appsScriptHiddenTarget" style="display:none; width:0; height:0; border:0;"></iframe>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    let ordersData = [];
    let searchQuery = "";
    let activeSelectedNickname = "";
    let multiNicknameChoices = [];
    let adminPassword = "0718"; // 구글 시트 '설정' 탭 동기화 전 기본 비밀번호

    const SHEET_ID = "11OG6u2i64D6exMiBgqGbkq-wrmxrYrVfLSzbYsBoXC8";
    const APPS_SCRIPT_SYNC_URL = "https://script.google.com/macros/s/AKfycbyvRsB4cUdnC0DgFz4TJcgmN7_YCf-4dO0MG4SMP0JsDb5BNLZLEY1bPxpA2YKuboAC/exec";

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'daiclo-order-sync';
    let db = null;
    let auth = null;
    let currentUser = null;

    // 미리보기 및 네트워크 지연 대비 샘플 데이터
    const SAMPLE_INITIAL_ORDERS = [
      { id: 'ORD-2', sheetRowIndex: 2, orderDate: '2026.09.08', pickupDate: '2026.09.11', nickname: '헬리오1234', productName: 'DAICLO 프리미엄 에어로 쿨링 셔츠', quantity: 2, amount: 58000, status: '픽업예정' },
      { id: 'ORD-3', sheetRowIndex: 3, orderDate: '2026.09.09', pickupDate: '2026.09.11', nickname: '헬리오1234', productName: 'DAICLO 컴포트 슬랙스 네이비 (L)', quantity: 1, amount: 39000, status: '픽업예정' },
      { id: 'ORD-4', sheetRowIndex: 4, orderDate: '2026.09.07', pickupDate: '2026.09.10', nickname: '송파러버', productName: 'DAICLO 방수 윈드브레이커 자켓', quantity: 1, amount: 72000, status: '완료' },
      { id: 'ORD-5', sheetRowIndex: 5, orderDate: '2026.09.10', pickupDate: '2026.09.12', nickname: '1234', productName: '데일리 오가닉 코튼 티셔츠 3팩', quantity: 1, amount: 29900, status: '픽업예정' }
    ];

    async function initCloudSync() {
      try {
        if (typeof __firebase_config === 'undefined') return;

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          const cred = await signInWithCustomToken(auth, __initial_auth_token);
          currentUser = cred.user;
        } else {
          const cred = await signInAnonymously(auth);
          currentUser = cred.user;
        }
      } catch (err) {
        console.warn("Init cloud sync failed:", err);
      }
    }

    function showToast(message, type = "success") {
      const toast = document.getElementById("toastNotification");
      const toastMsg = document.getElementById("toastMessage");
      const toastIcon = document.getElementById("toastIcon");
      if (!toast || !toastMsg || !toastIcon) return;

      toastMsg.textContent = message;
      if (type === "success") {
        toast.className = "fixed bottom-6 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-2xl text-white text-sm font-bold bg-emerald-600 transform translate-y-0 opacity-100";
        toastIcon.innerHTML = '<i data-lucide="check-circle" class="w-5 h-5"></i>';
      } else if (type === "info") {
        toast.className = "fixed bottom-6 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-2xl text-white text-sm font-bold bg-slate-800 transform translate-y-0 opacity-100";
        toastIcon.innerHTML = '<i data-lucide="info" class="w-5 h-5 text-emerald-400"></i>';
      } else {
        toast.className = "fixed bottom-6 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-2xl text-white text-sm font-bold bg-rose-600 transform translate-y-0 opacity-100";
        toastIcon.innerHTML = '<i data-lucide="alert-circle" class="w-5 h-5"></i>';
      }
      if (window.lucide) lucide.createIcons();

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translate(-50%, 20px)';
        toast.style.pointerEvents = 'none';
      }, 3000);
    }

    function updateNicknameChips() {
      const container = document.getElementById("matchingChipsContainer");
      const chipContainer = document.getElementById("nicknameChipList");
      if (!container || !chipContainer) return;
      
      chipContainer.innerHTML = "";

      // 1) 닉네임이 최종 선택된 경우: 심플하고 세련된 단일 인포 바 형태로 표시
      if (activeSelectedNickname) {
        container.classList.remove("hidden");
        const count = ordersData.filter(o => (o.nickname || "").toLowerCase() === activeSelectedNickname.toLowerCase()).length;

        const selectedBadge = document.createElement("div");
        selectedBadge.className = "inline-flex items-center gap-2 bg-white/10 hover:bg-white/15 backdrop-blur-md border border-emerald-300/30 pl-3 pr-2 py-1.5 rounded-full shadow-sm transition-all text-white animate-in fade-in duration-200";
        selectedBadge.innerHTML = `
          <div class="w-5 h-5 rounded-full bg-emerald-400/20 text-emerald-300 flex items-center justify-center shrink-0">
            <i data-lucide="check" class="w-3.5 h-3.5 stroke-[2.5]"></i>
          </div>
          <span class="text-xs font-semibold text-emerald-200/90 select-none">선택 회원</span>
          <span class="text-sm font-extrabold text-white tracking-tight">${escapeHtml(activeSelectedNickname)}</span>
          <span class="text-[11px] font-bold font-mono bg-emerald-950/60 text-emerald-300 px-2 py-0.5 rounded-full border border-emerald-600/40">${count}건</span>
          <button type="button" id="deselectNicknameBtn" title="선택 해제 및 목록 다시보기" aria-label="선택 해제" class="ml-0.5 w-6 h-6 rounded-full hover:bg-white/20 active:scale-90 flex items-center justify-center text-emerald-200 hover:text-white transition-all cursor-pointer">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        `;

        // X 버튼 누르면 선택 해제 후 후보 목록으로 복귀
        const deselectBtn = selectedBadge.querySelector("#deselectNicknameBtn");
        if (deselectBtn) {
          deselectBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            const allNicknames = [...new Set(ordersData.map(o => (o.nickname || "").trim()).filter(Boolean))];
            const input = document.getElementById("nicknameSearchInput");
            const val = input ? input.value.trim() : "";
            multiNicknameChoices = allNicknames.filter(n => n.toLowerCase().includes(val.toLowerCase()));
            activeSelectedNickname = "";
            render();
          });
        }

        chipContainer.appendChild(selectedBadge);
        if (window.lucide) lucide.createIcons();
        return;
      }

      // 2) 검색 결과 복수 후보 목록이 있을 경우: 닉네임 선택 라벨 아래부터 정렬
      if (multiNicknameChoices && multiNicknameChoices.length > 0) {
        container.classList.remove("hidden");

        const wrapper = document.createElement("div");
        wrapper.className = "flex flex-col gap-2 w-full";

        // 상단 안내 라벨 행
        const labelRow = document.createElement("div");
        labelRow.className = "flex items-center gap-1.5 text-xs text-emerald-200/90 font-bold select-none";
        labelRow.innerHTML = `
          <i data-lucide="user" class="w-3.5 h-3.5 text-emerald-300"></i>
          <span>닉네임 선택</span>
          <span class="text-[11px] font-mono font-bold text-emerald-300 bg-emerald-950/60 px-2 py-0.5 rounded-full border border-emerald-700/50">${multiNicknameChoices.length}건 검색됨</span>
        `;
        wrapper.appendChild(labelRow);

        // 라벨 아래부터 나열되는 닉네임 버튼 목록 영역 (스크롤 없이 전체 노출)
        const chipsList = document.createElement("div");
        chipsList.className = "flex flex-wrap items-center gap-2 py-0.5";

        multiNicknameChoices.forEach(nick => {
          const count = ordersData.filter(o => (o.nickname || "").toLowerCase() === nick.toLowerCase()).length;
          const chip = document.createElement("button");
          chip.type = "button";
          chip.className = "text-xs px-3 py-1.5 rounded-full font-medium bg-white/15 hover:bg-white/25 active:scale-95 text-white backdrop-blur-xs border border-white/20 shadow-xs transition-all flex items-center gap-1.5 cursor-pointer";
          chip.innerHTML = `
            <span class="truncate max-w-[140px] font-bold text-xs sm:text-sm">${escapeHtml(nick)}</span>
            <span class="text-[10px] bg-black/30 text-emerald-200 px-1.5 py-0.2 rounded-full font-mono font-bold">${count}건</span>
          `;
          chip.addEventListener("click", () => selectNickname(nick));
          chipsList.appendChild(chip);
        });

        wrapper.appendChild(chipsList);
        chipContainer.appendChild(wrapper);

        if (window.lucide) lucide.createIcons();
        return;
      }

      // 표시할 내역이 없는 경우
      container.classList.add("hidden");
    }

    function selectNickname(nick) {
      const searchInput = document.getElementById("nicknameSearchInput");
      activeSelectedNickname = nick;
      searchQuery = nick;

      if (searchInput) searchInput.value = nick;
      const clearBtn = document.getElementById("clearSearchBtn");
      if (clearBtn) clearBtn.classList.remove("hidden");
      render();
    }

    function clearSelectedNickname() {
      const searchInput = document.getElementById("nicknameSearchInput");
      activeSelectedNickname = "";
      searchQuery = "";
      multiNicknameChoices = [];
      if (searchInput) searchInput.value = "";
      const clearBtn = document.getElementById("clearSearchBtn");
      if (clearBtn) clearBtn.classList.add("hidden");
      render();
    }

    function executeNicknameSearch() {
      const input = document.getElementById("nicknameSearchInput");
      const val = input ? input.value.trim() : "";
      if (!val) return clearSelectedNickname();
      
      searchQuery = val;
      const allNicknames = [...new Set(ordersData.map(o => (o.nickname || "").trim()).filter(Boolean))];
      const matching = allNicknames.filter(n => n.toLowerCase().includes(val.toLowerCase()));

      activeSelectedNickname = "";
      multiNicknameChoices = matching;
      render();
      if(matching.length > 0) {
        showToast(`${matching.length}건 검색됨. 하단 칩을 클릭하세요.`, "info");
      } else {
        showToast("일치하는 닉네임이 없습니다. 주문하신 닉네임으로 다시 입력해주세요", "error");
      }
    }

    function renderOrders() {

      const empty = document.getElementById("emptyResultsState");

        initial.classList.remove("hidden");
        empty.classList.add("hidden");

          initial.classList.add("hidden");
          empty.classList.remove("hidden");
        }
        return;
      }

      initial.classList.add("hidden");

        const timeB = new Date(String(b.orderDate).replace(/\./g, '-')).getTime() || 0;

              <!-- 품목명 -->
              <span class="truncate text-black" title="${escapeHtml(order.productName || '상품명 없음')}">
                ${escapeHtml(order.productName || "상품명 없음")}
              </span>

              <!-- 단가 / 수량 / 합계 인라인 표시 (품목명과 동일한 크기 및 검은색 글자) -->
              <div class="inline-flex items-center gap-1 sm:gap-1.5 shrink-0 text-black">
                <span class="text-black select-none font-normal">/</span>
                <span class="whitespace-nowrap text-black">${Number(unitPrice).toLocaleString()}원</span>
                <span class="text-black select-none font-normal">/</span>
                <span class="whitespace-nowrap text-black">${order.quantity}개</span>
                <span class="text-black select-none font-normal">/</span>
                <span class="whitespace-nowrap text-black">${Number(order.amount).toLocaleString()}원</span>
              </div>
            </div>

            <!-- 우측 액션 버튼 (픽업 / 완료) -->
            <div class="shrink-0 flex items-center justify-end ml-1">
              ${isComplete 
                ? `
                  <div class="px-2.5 py-1 sm:px-3 sm:py-1 rounded-lg text-[11px] sm:text-xs font-bold flex items-center gap-1 bg-brand-100 text-brand-900 border border-brand-300 shadow-2xs">
                    <i data-lucide="check-circle-2" class="w-3.5 h-3.5 sm:w-4 sm:h-4 text-brand-700"></i>
                    <span>완료</span>
                  </div>
                `
                : `<button type="button" onclick="window.processPickup('${order.id}')" class="px-2.5 py-1 sm:px-3 sm:py-1.5 rounded-lg text-xs sm:text-sm font-bold transition-all flex items-center gap-1 shadow-2xs border border-brand-500 bg-white text-brand-800 hover:bg-brand-50 active:scale-95 cursor-pointer"><i data-lucide="check" class="w-3.5 h-3.5 text-brand-600 stroke-[2.5]"></i><span>픽업</span></button>`
              }
            </div>
          </div>

          <!-- 하단 라인: 주문일자 / 픽업예정일자 및 우측 일자/시각 (구분선 없이 자연스러운 간격 배치) -->
          <div class="flex items-center justify-between gap-2 pt-0.5 sm:pt-1 text-xs sm:text-sm md:text-base text-brand-900 font-normal">
            <div class="flex items-center gap-2 sm:gap-2.5 shrink-0 text-brand-900">
              <div class="inline-flex items-center gap-1 text-brand-900">
                <span class="text-brand-900">주문 :</span>
                <span class="text-brand-900 whitespace-nowrap">${escapeHtml(order.orderDate || "-")}</span>
              </div>
              <span class="text-brand-700/60 select-none">|</span>
              <div class="inline-flex items-center gap-1 text-brand-900">
                <span class="text-brand-900">픽업예정 :</span>
                <span class="text-brand-900 whitespace-nowrap">${escapeHtml(order.pickupDate || "-")}</span>
              </div>
            </div>

            <!-- 완료 시각 (동일한 일반 굵기) -->
            ${isComplete && completedTimeText ? `
              <div class="font-normal text-brand-900 shrink-0 select-all tracking-tight text-right text-xs sm:text-sm md:text-base">
                ${escapeHtml(completedTimeText)}

      if (window.lucide) lucide.createIcons();

    function render() {
      updateNicknameChips();
      renderOrders();
    }

    // 픽업완료 처리: 화면 반영 + Apps Script를 통해 주문데이터 H열에 "완료" 기록
    window.processPickup = function(orderId) {
      const order = ordersData.find(o => o.id === orderId);
      if (!order) {
        showToast("주문을 찾을 수 없습니다.", "error");
        return;
      }

      // 중복 클릭 방지
      if (order._processing) return;
      order._processing = true;

      // 일자 및 시각 포맷 생성 (예: 2026.09.12 22:49:05)
      const now = new Date();
      const pad = (n) => String(n).padStart(2, "0");
      const formattedTimestamp = `${now.getFullYear()}.${pad(now.getMonth() + 1)}.${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

      // 1. 화면 즉시 완료 및 일자/시각 반영
      order.status = "완료";
      order.completedAt = formattedTimestamp;
      order.processedTime = formattedTimestamp;

      // 로컬 스토리지에 캐싱하여 새로고침 시에도 일자/시각 보존
      try {
        localStorage.setItem(`daiclo_completed_${order.id}`, formattedTimestamp);
        if (order.sheetRowIndex) {
          localStorage.setItem(`daiclo_completed_row_${order.sheetRowIndex}`, formattedTimestamp);
        }
      } catch (_) {}

      render();

      // 2. Apps Script의 testDirect() 함수를 명시적으로 실행하도록 파라미터 구성
      const callbackName = "cb_as_" + Date.now();
      window[callbackName] = function(res) {
        delete window[callbackName];
        console.log("Apps Script 수신 결과:", res);
        showToast(`[${order.nickname}] 시트 업데이트 완료 (${formattedTimestamp})`, "success");
      };

      // 1) test 탭 등록 기능 삭제
      // 2) 주문데이터탭 H열("완료") 및 I열(픽업버튼 누른 시각) 동시 등록 전송 규격
      const payload = {
        action: 'updatePickup',
        method: 'updatePickup',
        functionName: 'testDirect', // 기존 Apps Script 배포 함수와의 하위 호환성 유지
        callback: callbackName,

        // 대상 시트 지정: 오직 '주문데이터' 탭만 대상으로 처리 (test 탭 제외)
        sheetName: '주문데이터',
        targetSheet: '주문데이터',

        // 행 번호
        sheetRowIndex: String(order.sheetRowIndex || ''),
        row: String(order.sheetRowIndex || ''),

        // H열(8번째 컬럼): '완료' 상태
        col: '8',
        statusCol: 'H',
        status: '완료',
        newStatus: '완료',

        // I열(9번째 컬럼): 픽업버튼 누른 시각
        timeCol: '9',
        pickupTimeCol: 'I',
        timeColLetter: 'I',
        pickupTime: formattedTimestamp,
        pickupCheckTime: formattedTimestamp,
        time: formattedTimestamp,
        processedTime: formattedTimestamp,

        // 기타 주문 식별 정보
        orderId: String(order.id || ''),
        nickname: String(order.nickname || ''),
        _t: String(Date.now())
      };

      try {
        const queryParams = new URLSearchParams(payload).toString();
        const targetUrl = APPS_SCRIPT_SYNC_URL + (APPS_SCRIPT_SYNC_URL.includes('?') ? '&' : '?') + queryParams;

        // 1순위: JSONP 방식의 Script Tag 동적 주입
        try {
          const sTag = document.createElement('script');
          sTag.src = targetUrl;
          sTag.onload = () => { if (sTag.parentNode) sTag.parentNode.removeChild(sTag); };
          sTag.onerror = () => { 
            console.warn("Script tag error, fallbacking to fetch/beacon");
            if (sTag.parentNode) sTag.parentNode.removeChild(sTag); 
          };
          document.body.appendChild(sTag);
        } catch (_) {}

        // 2순위: fetch with mode: 'no-cors' 및 keepalive
        fetch(targetUrl, {
          method: 'GET',
          mode: 'no-cors',
          cache: 'no-cache',
          keepalive: true
        }).catch(() => {});

        // 3순위: 이미지 비콘
        const beaconImg = new Image();
        beaconImg.src = targetUrl;

        // 4순위: 숨김 iframe src
        const hiddenIframe = document.getElementById('appsScriptHiddenTarget');
        if (hiddenIframe) {
          hiddenIframe.src = targetUrl;
        }

        showToast(`[${order.nickname}] 완료 처리됨 (${formattedTimestamp})`, 'success');
        console.log('Apps Script 요청 발송 URL:', targetUrl);
      } catch (e) {
        console.error('Apps Script 호출 실패:', e);
        showToast(`[${order.nickname}] 전송 오류 발생`, 'error');
        order.status = '픽업예정';
        order.completedAt = null;
        order.processedTime = null;
        order._processing = false;
        render();
      }
    };

    function processRawMatrix(matrix) {
      if (!matrix || matrix.length === 0) return [];
      
      // 헤더 행 자동 탐지
      let headerRowIndex = -1;
      for (let i = 0; i < Math.min(matrix.length, 5); i++) {
        const rowStr = (matrix[i] || []).join("");
        if (rowStr.includes("주문") || rowStr.includes("닉네임") || rowStr.includes("상품")) {
          headerRowIndex = i;
          break;
        }
      }

      let colOrderDate = 0;   // A열: 주문일자
      let colPickupDate = 1;  // B열: 픽업일자
      let colNickname = 2;    // C열: 닉네임
      let colProduct = 3;     // D열: 상품명
      let colQty = 4;         // E열: 수량
      let colAmount = 6;      // G열/F열: 금액
      let colStatus = 7;      // H열: 픽업상태
      let colTimestampIdx = 8; // I열: 픽업체크시각 기본값 (0-indexed 8번)

      if (headerRowIndex >= 0) {
        const headers = matrix[headerRowIndex].map(h => String(h || "").trim());
        headers.forEach((h, idx) => {
          if (h.includes("주문일") || h.includes("주문날짜")) colOrderDate = idx;
          else if (h.includes("픽업예정") || h.includes("픽업일")) colPickupDate = idx;
          else if (h.includes("닉네임")) colNickname = idx;
          else if (h.includes("상품") || h.includes("품목")) colProduct = idx;
          else if (h.includes("수량")) colQty = idx;
          else if (h.includes("금액") || h.includes("결제")) colAmount = idx;
          else if (h.includes("상태") || h.includes("픽업상태")) colStatus = idx;
          else if (h.includes("체크시각") || h.includes("픽업시각") || h.includes("완료시각") || h.includes("시각")) colTimestampIdx = idx;
        });
      }

      const offset = headerRowIndex >= 0 ? headerRowIndex + 1 : 0;
      const results = [];

      for (let i = offset; i < matrix.length; i++) {
        const row = matrix[i];
        if (!row || row.length < 3) continue;

        const nickname = (row[colNickname] !== undefined ? row[colNickname] : row[2] || "").toString().trim();
        if (!nickname) continue;

        // 주문상태(H열)의 현재 값 판별
        const statusRaw = (row[colStatus] !== undefined ? row[colStatus] : row[7] || "").toString().trim();
        const status = (statusRaw === "완료" || statusRaw.includes("완료") || statusRaw === "1") ? "완료" : "픽업예정";

        // 구글 시트의 실제 행 번호: gviz의 data.table.rows는 1행(헤더)을 제외한 2행부터 시작하므로 (i + 2)행입니다.
        const sheetRow = i + 2;
        const orderId = `ORD-${sheetRow}`;
        let savedTimestamp = "";
        try {
          savedTimestamp = localStorage.getItem(`daiclo_completed_${orderId}`) || 
                           localStorage.getItem(`daiclo_completed_row_${sheetRow}`) || "";
        } catch (_) {}

        // I열(9번째 열 / 0-indexed 8번)에 기록된 픽업체크시각 확인
        const colTimestamp = (row[colTimestampIdx] !== undefined ? row[colTimestampIdx] : (row[8] || "")).toString().trim();
        const finalTimestamp = colTimestamp || savedTimestamp || null;

        results.push({
          id: orderId,
          sheetRowIndex: sheetRow,
          orderDate: (row[colOrderDate] || "").toString().trim() || "-",
          pickupDate: (row[colPickupDate] || "").toString().trim() || "-",
          nickname: nickname,
          productName: (row[colProduct] || "").toString().trim(),
          quantity: parseInt((row[colQty] || "1").toString().replace(/[^0-9]/g, "")) || 1,
          amount: parseFloat((row[colAmount] || row[5] || "0").toString().replace(/[^0-9]/g, "")) || 0,
          status: status,
          completedAt: status === "완료" ? finalTimestamp : null,
          processedTime: status === "완료" ? finalTimestamp : null
        });
      }
      return results;
    }

    // 구글 스프레드시트 '설정' 탭에서 관리자 비밀번호 동적 로드
    function loadSettingsSheetData() {
      const callbackName = "cb_settings_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
      const script = document.createElement("script");
      let timeoutHandler = null;

      window[callbackName] = function(data) {
        if (timeoutHandler) clearTimeout(timeoutHandler);
        if (script.parentNode) script.parentNode.removeChild(script);
        delete window[callbackName];

        try {
          if (data && data.table && data.table.rows && data.table.rows.length > 0) {
            const matrix = data.table.rows.map(row => (row.c || []).map(c => c ? (c.f !== undefined && c.f !== null ? c.f : (c.v !== undefined && c.v !== null ? c.v : "")) : ""));
            
            let foundPassword = "";

            // '비밀번호', '패스워드', 'password' 항목 탐색 (가로/세로 배치 모두 지원)
            for (let r = 0; r < matrix.length; r++) {
              for (let c = 0; c < matrix[r].length; c++) {
                const cellVal = String(matrix[r][c] || "").trim();
                if (cellVal.includes("비밀번호") || cellVal.toLowerCase().includes("password") || cellVal.includes("패스워드")) {
                  // 1. 같은 행 오른쪽 셀(B열 등) 확인
                  if (matrix[r][c + 1] !== undefined && String(matrix[r][c + 1]).trim() !== "") {
                    foundPassword = String(matrix[r][c + 1]).trim();
                    break;
                  }
                  // 2. 아래 행 같은 열(2행 등) 확인
                  if (r + 1 < matrix.length && matrix[r + 1][c] !== undefined && String(matrix[r + 1][c]).trim() !== "") {
                    foundPassword = String(matrix[r + 1][c]).trim();
                    break;
                  }
                }
              }
              if (foundPassword) break;
            }

            // 레이블 없이 단순 값만 존재하는 경우(예: A2 또는 B1)
            if (!foundPassword && matrix.length > 0) {
              if (matrix.length > 1 && matrix[1][0] !== undefined && String(matrix[1][0]).trim() !== "") {
                foundPassword = String(matrix[1][0]).trim();
              } else if (matrix[0][1] !== undefined && String(matrix[0][1]).trim() !== "") {
                foundPassword = String(matrix[0][1]).trim();
              }
            }

            if (foundPassword) {
              adminPassword = String(foundPassword).trim();
            }
          }
        } catch (err) {
          console.warn("Settings sheet parse error:", err);
        }
      };

      timeoutHandler = setTimeout(() => {
        if (window[callbackName]) {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }
      }, 3500);

      script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent("설정")}&tqx=responseHandler:${callbackName}`;
      script.onerror = () => {
        if (timeoutHandler) clearTimeout(timeoutHandler);
        if (window[callbackName]) {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }
      };
      document.body.appendChild(script);
    }

    let isUserDbUpdateRequested = false;

    function loadGoogleSheetData(isSilent = false) {
      if(!isSilent) showToast("데이터 갱신 중...", "info");
      
      const callbackName = "cb_" + Date.now() + "_" + Math.floor(Math.random()*1000);
      const script = document.createElement("script");
      let timeoutHandler = null;
      
      window[callbackName] = function(data) {
        if (timeoutHandler) clearTimeout(timeoutHandler);
        if(script.parentNode) script.parentNode.removeChild(script);
        delete window[callbackName];
        
        if (data && data.table && data.table.rows) {
          const matrix = data.table.rows.map(row => (row.c || []).map(c => c ? (c.f || c.v || "") : ""));
          const parsed = processRawMatrix(matrix);
          ordersData = parsed.length > 0 ? parsed : SAMPLE_INITIAL_ORDERS;

          const now = new Date();
          const dateStr = now.toLocaleDateString();
          const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          const statusElem = document.getElementById("statSourceStatus");
          if (statusElem) statusElem.textContent = dateStr + " " + timeStr + " 갱신됨";
          
          render();

          if (isUserDbUpdateRequested) {
            isUserDbUpdateRequested = false;
            if (typeof window.showAlert === "function") {
              window.showAlert("<strong>DB UPDATE가 정상적으로 완료되었습니다.</strong><br><span class='text-xs text-slate-500 mt-1.5 block font-normal'>구글 시트의 최신 주문 데이터가 성공적으로 반영되었습니다.</span>");
            } else {
              showToast("DB UPDATE가 완료되었습니다.", "success");
            }
          }
        }
      };

      // 타임아웃 발생 시 로컬 샘플 데이터로 복구 보장
      timeoutHandler = setTimeout(() => {
        if (window[callbackName]) {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
          if (ordersData.length === 0) {
            ordersData = [...SAMPLE_INITIAL_ORDERS];
            render();
          }
          const statusElem = document.getElementById("statSourceStatus");
          if (statusElem) statusElem.textContent = "로컬/최신 캐시 데이터 적용됨";

          if (isUserDbUpdateRequested) {
            isUserDbUpdateRequested = false;
            if (typeof window.showAlert === "function") {
              window.showAlert("<strong>DB UPDATE가 완료되었습니다.</strong><br><span class='text-xs text-slate-500 mt-1.5 block font-normal'>최신 캐시 데이터가 반영되었습니다.</span>");
            }
          }
        }
      }, 3500);

      // 구글 스프레드시트의 '주문데이터' 탭을 명시적으로 호출
      script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent("주문데이터")}&tqx=responseHandler:${callbackName}`;
      script.onerror = () => {
        if (timeoutHandler) clearTimeout(timeoutHandler);
        // '주문데이터' 탭 이름 로드 실패 시 기본 첫 번째 시트로 fallback 재시도
        const fallbackScript = document.createElement("script");
        fallbackScript.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:${callbackName}`;
        document.body.appendChild(fallbackScript);
      };
      document.body.appendChild(script);
    }

    document.addEventListener("DOMContentLoaded", () => {
      ordersData = [...SAMPLE_INITIAL_ORDERS];
      
      // 실시간 클라우드 공유 및 구글 시트 초기화
      initCloudSync();
      loadSettingsSheetData();
      loadGoogleSheetData(false);

      // 홈 화면 리프레시 함수 (초기화 및 데이터 동기화)
      function resetToHomeScreen(isManual = false) {
        clearSelectedNickname();
        
        // 열려 있는 모달 닫기
        if (typeof togglePwModal === "function") togglePwModal(false);
        const customAlertModal = document.getElementById("customAlertModal");
        if (customAlertModal) customAlertModal.classList.add("opacity-0", "pointer-events-none");
        const customConfirmModal = document.getElementById("customConfirmModal");
        if (customConfirmModal) customConfirmModal.classList.add("opacity-0", "pointer-events-none");

        // 백그라운드 데이터 동기화 (주문데이터, 관리자설정)
        loadSettingsSheetData();
        loadGoogleSheetData(true);

        if (isManual) {
          showToast("홈 화면으로 새로고침되었습니다.", "info");
        }
      }

      // 홈 리프레시 버튼 클릭 이벤트 (수동)
      const manualHomeRefreshBtn = document.getElementById("manualHomeRefreshBtn");
      if (manualHomeRefreshBtn) {
        manualHomeRefreshBtn.addEventListener("click", () => {
          resetToHomeScreen(true);
        });
      }

      // 상단 DAICLO 로고 클릭 시에도 홈 화면 리프레시 동일 실행
      const headerLogoBtn = document.getElementById("headerLogoBtn");
      if (headerLogoBtn) {
        headerLogoBtn.addEventListener("click", () => {
          resetToHomeScreen(true);
        });
      }

      // 10분(600,000ms)마다 자동으로 홈버튼 클릭 (화면 초기화 및 데이터 최신화)
      const AUTO_HOME_REFRESH_INTERVAL = 10 * 60 * 1000;
      setInterval(() => {
        const homeBtn = document.getElementById("manualHomeRefreshBtn");
        if (homeBtn) {
          homeBtn.click();
        } else {
          resetToHomeScreen(false);
        }
      }, AUTO_HOME_REFRESH_INTERVAL);

      // 커스텀 안내 팝업(Alert 대체) 로직
      const customAlertModal = document.getElementById("customAlertModal");
      const customAlertContent = document.getElementById("customAlertContent");
      const customAlertMessage = document.getElementById("customAlertMessage");

      window.showAlert = function(message) {
        if (!customAlertModal || !customAlertContent || !customAlertMessage) return;
        customAlertMessage.innerHTML = message;
        customAlertModal.classList.remove("opacity-0", "pointer-events-none");
        customAlertContent.classList.remove("scale-95");
        if (window.lucide) lucide.createIcons();
      };

      const closeAlertBtn = document.getElementById("closeAlertBtn");
      if (closeAlertBtn) {
        closeAlertBtn.addEventListener("click", () => {
          customAlertModal.classList.add("opacity-0", "pointer-events-none");
          customAlertContent.classList.add("scale-95");
        });
      }

      const customConfirmModal = document.getElementById("customConfirmModal");
      const customConfirmContent = document.getElementById("customConfirmContent");
      const customConfirmMessage = document.getElementById("customConfirmMessage");
      const customConfirmOkBtn = document.getElementById("customConfirmOkBtn");
      const customConfirmCancelBtn = document.getElementById("customConfirmCancelBtn");
      let currentConfirmCallback = null;

      window.showCustomConfirm = function(message, onConfirm) {
        if (!customConfirmModal) return;
        customConfirmMessage.textContent = message;
        currentConfirmCallback = onConfirm;
        customConfirmModal.classList.remove("opacity-0", "pointer-events-none");
        customConfirmContent.classList.remove("scale-95");
        if (window.lucide) lucide.createIcons();
      };

      const closeConfirmModal = () => {
        customConfirmModal.classList.add("opacity-0", "pointer-events-none");
        customConfirmContent.classList.add("scale-95");
        currentConfirmCallback = null;
      };

      if (customConfirmCancelBtn) customConfirmCancelBtn.addEventListener("click", closeConfirmModal);
      if (customConfirmOkBtn) {
        customConfirmOkBtn.addEventListener("click", () => {
          if (typeof currentConfirmCallback === "function") {
            currentConfirmCallback();
          }
          closeConfirmModal();
        });
      }

      // 검색 제어
      const searchBtn = document.getElementById("searchNicknameBtn");
      const searchInput = document.getElementById("nicknameSearchInput");
      const clearBtn = document.getElementById("clearSearchBtn");
      const resetBtn = document.getElementById("resetAllFiltersBtn");

      if (searchBtn) searchBtn.addEventListener("click", executeNicknameSearch);
      if (searchInput) {
        searchInput.addEventListener("keydown", e => { if (e.key === "Enter") executeNicknameSearch(); });
        searchInput.addEventListener("input", e => {
          if (clearBtn) clearBtn.classList.toggle("hidden", !e.target.value);
        });
      }
      if (clearBtn) clearBtn.addEventListener("click", clearSelectedNickname);
      if (resetBtn) resetBtn.addEventListener("click", clearSelectedNickname);

      // 비밀번호 모달 제어 (기본 비밀번호: 0718)
      const pwModal = document.getElementById("passwordModal");
      const pwContent = document.getElementById("passwordModalContent");
      const pwInput = document.getElementById("adminPasswordInput");
      
      const togglePwModal = (show) => {
        if (!pwModal || !pwContent || !pwInput) return;
        pwModal.classList.toggle("opacity-0", !show);
        pwModal.classList.toggle("pointer-events-none", !show);
        pwContent.classList.toggle("scale-95", !show);
        if(show) { pwInput.value = ''; setTimeout(() => pwInput.focus(), 120); }
      };

      const systemSyncBtn = document.getElementById("systemSyncBtn");
      if (systemSyncBtn) {
        systemSyncBtn.addEventListener("click", () => {
          togglePwModal(true);
        });
      }

      const cancelPwBtn = document.getElementById("cancelPasswordBtn");
      if (cancelPwBtn) cancelPwBtn.addEventListener("click", () => togglePwModal(false));
      
      const checkPassword = () => {
        if (!pwInput) return;
        const entered = pwInput.value.trim();
        const validPassword = String(adminPassword).trim();

        if(entered === validPassword || entered === "0718") {
          togglePwModal(false);
          isUserDbUpdateRequested = true;
          loadGoogleSheetData(false);
          loadSettingsSheetData();
          showToast("DB Update를 시작합니다.", "info");
        } else {
          pwInput.value = '';
          if (typeof showAlert === "function") {
            showAlert("입력하신 비밀번호가 올바르지 않습니다.<br><span class='text-xs text-slate-400 mt-1 block font-normal'>비밀번호를 다시 확인 후 입력해 주세요.</span>");
          } else {
            showToast("비밀번호가 일치하지 않습니다.", "error");
          }
          pwInput.focus();
        }
      };

      const verifyPwBtn = document.getElementById("verifyPasswordBtn");
      if (verifyPwBtn) verifyPwBtn.addEventListener("click", checkPassword);
      if (pwInput) pwInput.addEventListener("keydown", e => { if (e.key === "Enter") checkPassword(); });

      if (window.lucide) lucide.createIcons();
    });

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>

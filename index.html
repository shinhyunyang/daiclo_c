  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    let ordersData = [];
    let searchQuery = "";
    let activeSelectedNickname = "";
    let multiNicknameChoices = [];
    let adminPassword = "0718";

    const SHEET_ID = "11OG6u2i64D6exMiBgqGbkq-wrmxrYrVfLSzbYsBoXC8";
    const APPS_SCRIPT_SYNC_URL = "https://script.google.com/macros/s/AKfycbyvRsB4cUdnC0DgFz4TJcgmN7_YCf-4dO0MG4SMP0JsDb5BNLZLEY1bPxpA2YKuboAC/exec";

    let db = null;
    let auth = null;
    let currentUser = null;

    const SAMPLE_INITIAL_ORDERS = [
      { id: 'ORD-2', sheetRowIndex: 2, orderDate: '2026.09.08', pickupDate: '2026.09.11', nickname: '헬리오1234', productName: 'DAICLO 프리미엄 에어로 쿨링 셔츠', quantity: 2, amount: 58000, status: '픽업예정' },
      { id: 'ORD-3', sheetRowIndex: 3, orderDate: '2026.09.09', pickupDate: '2026.09.11', nickname: '헬리오1234', productName: 'DAICLO 컴포트 슬랙스 네이비 (L)', quantity: 1, amount: 39000, status: '픽업예정' },
      { id: 'ORD-4', sheetRowIndex: 4, orderDate: '2026.09.07', pickupDate: '2026.09.10', nickname: '송파러버', productName: 'DAICLO 방수 윈드브레이커 자켓', quantity: 1, amount: 72000, status: '완료' },
      { id: 'ORD-5', sheetRowIndex: 5, orderDate: '2026.09.10', pickupDate: '2026.09.12', nickname: '1234', productName: '데일리 오가닉 코튼 티셔츠 3팩', quantity: 1, amount: 29900, status: '픽업예정' }
    ];

    async function initCloudSync() {
      try {
        if (typeof __firebase_config === 'undefined') return;

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          const cred = await signInWithCustomToken(auth, __initial_auth_token);
          currentUser = cred.user;
        } else {
          const cred = await signInAnonymously(auth);
          currentUser = cred.user;
        }
      } catch (err) {
        console.warn("Init cloud sync failed:", err);
      }
    }

    function showToast(message, type = "success") {
      const toast = document.getElementById("toastNotification");
      const toastMsg = document.getElementById("toastMessage");
      const toastIcon = document.getElementById("toastIcon");
      if (!toast || !toastMsg || !toastIcon) return;

      toastMsg.textContent = message;
      if (type === "success") {
        toast.className = "fixed bottom-6 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-2xl text-white text-sm font-bold bg-emerald-600 transform translate-y-0 opacity-100";
        toastIcon.innerHTML = '<i data-lucide="check-circle" class="w-5 h-5"></i>';
      } else if (type === "info") {
        toast.className = "fixed bottom-6 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-2xl text-white text-sm font-bold bg-slate-800 transform translate-y-0 opacity-100";
        toastIcon.innerHTML = '<i data-lucide="info" class="w-5 h-5 text-emerald-400"></i>';
      } else {
        toast.className = "fixed bottom-6 left-1/2 -translate-x-1/2 z-50 transition-all duration-300 flex items-center gap-3 px-5 py-3.5 rounded-2xl shadow-2xl text-white text-sm font-bold bg-rose-600 transform translate-y-0 opacity-100";
        toastIcon.innerHTML = '<i data-lucide="alert-circle" class="w-5 h-5"></i>';
      }
      if (window.lucide) lucide.createIcons();

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translate(-50%, 20px)';
        toast.style.pointerEvents = 'none';
      }, 3000);
    }

    function updateNicknameChips() {
      const container = document.getElementById("matchingChipsContainer");
      const chipContainer = document.getElementById("nicknameChipList");
      if (!container || !chipContainer) return;
      
      chipContainer.innerHTML = "";

      if (activeSelectedNickname) {
        container.classList.remove("hidden");

        const selectedBadge = document.createElement("div");
        selectedBadge.className = "inline-flex items-center gap-2.5 bg-white text-slate-900 pl-3.5 pr-2 py-1.5 sm:py-2 rounded-full shadow-lg border border-emerald-100 transition-all animate-in fade-in duration-200";
        selectedBadge.innerHTML = `
          <div class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-700 flex items-center justify-center shrink-0">
            <i data-lucide="check" class="w-3.5 h-3.5 stroke-[3]"></i>
          </div>
          <span class="text-xs font-bold text-emerald-800 select-none">선택 회원</span>
          <span class="text-sm sm:text-base font-black text-slate-900 tracking-tight">${escapeHtml(activeSelectedNickname)}</span>
          <button type="button" id="deselectNicknameBtn" title="선택 해제 및 목록 다시보기" aria-label="선택 해제" class="ml-1 w-6 h-6 rounded-full hover:bg-slate-100 active:scale-90 flex items-center justify-center text-slate-400 hover:text-slate-800 transition-all cursor-pointer">
            <i data-lucide="x" class="w-4 h-4 stroke-[2.5]"></i>
          </button>
        `;

        const deselectBtn = selectedBadge.querySelector("#deselectNicknameBtn");
        if (deselectBtn) {
          deselectBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            const allNicknames = [...new Set(ordersData.map(o => (o.nickname || "").trim()).filter(Boolean))];
            const input = document.getElementById("nicknameSearchInput");
            const val = input ? input.value.trim() : "";
            multiNicknameChoices = allNicknames.filter(n => n.toLowerCase().includes(val.toLowerCase()));
            activeSelectedNickname = "";
            render();
          });
        }

        chipContainer.appendChild(selectedBadge);
        if (window.lucide) lucide.createIcons();
        return;
      }

      if (multiNicknameChoices && multiNicknameChoices.length > 0) {
        container.classList.remove("hidden");

        const wrapper = document.createElement("div");
        wrapper.className = "flex flex-col gap-2.5 w-full";

        const labelRow = document.createElement("div");
        labelRow.className = "flex items-center gap-2 text-sm sm:text-base text-white font-extrabold select-none";
        labelRow.innerHTML = `
          <i data-lucide="user" class="w-4 h-4 sm:w-5 sm:h-5 text-emerald-200 stroke-[2.5]"></i>
          <span class="tracking-tight drop-shadow-xs">닉네임을 선택해 주세요</span>
        `;
        wrapper.appendChild(labelRow);

        // 라벨 아래부터 나열되는 닉네임 버튼 목록 영역 (스크롤 없이 전체 노출)
        const chipsList = document.createElement("div");
        chipsList.className = "flex flex-wrap items-center gap-2 py-0.5";

        multiNicknameChoices.forEach(nick => {
          const chip = document.createElement("button");
          chip.type = "button";

      empty.classList.add("hidden");

      // 날짜 문자열(예: '2026. 9. 9', '2026.09.09')을 타임스탬프로 안전하게 변환
      const parseDateToTime = (dateStr) => {
        const parts = String(dateStr || "").match(/\d+/g);
        if (!parts || parts.length < 3) return 0;
        return new Date(parts[0], parseInt(parts[1], 10) - 1, parts[2]).getTime() || 0;
      };

      // 1순위: '픽업 전' 주문 우선 배치, '픽업 완료'는 아래로

        const isCompleteA = a.status === "완료" || a.status === "1";
        const isCompleteB = b.status === "완료" || b.status === "1";

        if (isCompleteA !== isCompleteB) {
          return isCompleteA ? 1 : -1;
        }

        const timeA = parseDateToTime(a.orderDate);
        const timeB = parseDateToTime(b.orderDate);
        if (timeB !== timeA) return timeB - timeA;

        return (b.sheetRowIndex || 0) - (a.sheetRowIndex || 0);

              ${escapeHtml(order.productName || "상품명 없음")}

            <span class="${isComplete ? 'text-emerald-900/40' : 'text-slate-300'} font-normal select-none">/</span>
            <span class="whitespace-nowrap">${order.quantity}개</span>
            <span class="${isComplete ? 'text-emerald-900/40' : 'text-slate-300'} font-normal select-none">/</span>
            <span class="${isComplete ? 'text-emerald-950/90' : 'text-emerald-950'} font-extrabold whitespace-nowrap">${Number(order.amount).toLocaleString()}원</span>
          </div>

          <!-- 두번째줄: 주문일자, 픽업예정일자, 주문상태값 -->

    function processRawMatrix(matrix) {
      if (!matrix || matrix.length === 0) return [];
      
      let headerRowIndex = -1;
      for (let i = 0; i < Math.min(matrix.length, 5); i++) {
        const rowStr = (matrix[i] || []).join("");
        if (rowStr.includes("주문") || rowStr.includes("닉네임") || rowStr.includes("상품")) {
          headerRowIndex = i;
          break;
        }
      }

      let colOrderDate = 0;
      let colPickupDate = 1;
      let colNickname = 2;
      let colProduct = 3;
      let colQty = 4;
      let colAmount = 6;
      let colStatus = 7;
      let colTimestampIdx = 8;

      if (headerRowIndex >= 0) {
        const headers = matrix[headerRowIndex].map(h => String(h || "").trim());
        headers.forEach((h, idx) => {
          if (h.includes("주문일") || h.includes("주문날짜")) colOrderDate = idx;
          else if (h.includes("픽업예정") || h.includes("픽업일")) colPickupDate = idx;
          else if (h.includes("닉네임")) colNickname = idx;
          else if (h.includes("상품") || h.includes("품목")) colProduct = idx;
          else if (h.includes("수량")) colQty = idx;
          else if (h.includes("금액") || h.includes("결제")) colAmount = idx;
          else if (h.includes("상태") || h.includes("픽업상태")) colStatus = idx;
          else if (h.includes("체크시각") || h.includes("픽업시각") || h.includes("완료시각") || h.includes("시각")) colTimestampIdx = idx;
        });
      }

      const offset = headerRowIndex >= 0 ? headerRowIndex + 1 : 0;
      const results = [];

      for (let i = offset; i < matrix.length; i++) {
        const row = matrix[i];
        if (!row || row.length < 3) continue;

        const nickname = (row[colNickname] !== undefined ? row[colNickname] : row[2] || "").toString().trim();
        if (!nickname) continue;

        const statusRaw = (row[colStatus] !== undefined ? row[colStatus] : row[7] || "").toString().trim();
        const status = (statusRaw === "완료" || statusRaw.includes("완료") || statusRaw === "1") ? "완료" : "픽업예정";

        const sheetRow = i + 2;
        const orderId = `ORD-${sheetRow}`;
        let savedTimestamp = "";
        try {
          savedTimestamp = localStorage.getItem(`daiclo_completed_${orderId}`) || 
                           localStorage.getItem(`daiclo_completed_row_${sheetRow}`) || "";
        } catch (_) {}

        const colTimestamp = (row[colTimestampIdx] !== undefined ? row[colTimestampIdx] : (row[8] || "")).toString().trim();
        const finalTimestamp = colTimestamp || savedTimestamp || null;

        results.push({
          id: orderId,
          sheetRowIndex: sheetRow,
          orderDate: (row[colOrderDate] || "").toString().trim() || "-",
          pickupDate: (row[colPickupDate] || "").toString().trim() || "-",
          nickname: nickname,
          productName: (row[colProduct] || "").toString().trim(),
          quantity: parseInt((row[colQty] || "1").toString().replace(/[^0-9]/g, "")) || 1,
          amount: parseFloat((row[colAmount] || row[5] || "0").toString().replace(/[^0-9]/g, "")) || 0,
          status: status,
          completedAt: status === "완료" ? finalTimestamp : null,
          processedTime: status === "완료" ? finalTimestamp : null
        });
      }
      return results;
    }

    function loadSettingsSheetData() {
      const callbackName = "cb_settings_" + Date.now() + "_" + Math.floor(Math.random() * 1000);
      const script = document.createElement("script");
      let timeoutHandler = null;

      window[callbackName] = function(data) {
        if (timeoutHandler) clearTimeout(timeoutHandler);
        if (script.parentNode) script.parentNode.removeChild(script);
        delete window[callbackName];

        try {
          if (data && data.table && data.table.rows && data.table.rows.length > 0) {
            const matrix = data.table.rows.map(row => (row.c || []).map(c => c ? (c.f !== undefined && c.f !== null ? c.f : (c.v !== undefined && c.v !== null ? c.v : "")) : ""));
            
            let foundPassword = "";

            for (let r = 0; r < matrix.length; r++) {
              for (let c = 0; c < matrix[r].length; c++) {
                const cellVal = String(matrix[r][c] || "").trim();
                if (cellVal.includes("비밀번호") || cellVal.toLowerCase().includes("password") || cellVal.includes("패스워드")) {
                  if (matrix[r][c + 1] !== undefined && String(matrix[r][c + 1]).trim() !== "") {
                    foundPassword = String(matrix[r][c + 1]).trim();
                    break;
                  }
                  if (r + 1 < matrix.length && matrix[r + 1][c] !== undefined && String(matrix[r + 1][c]).trim() !== "") {
                    foundPassword = String(matrix[r + 1][c]).trim();
                    break;
                  }
                }
              }
              if (foundPassword) break;
            }

            if (!foundPassword && matrix.length > 0) {
              if (matrix.length > 1 && matrix[1][0] !== undefined && String(matrix[1][0]).trim() !== "") {
                foundPassword = String(matrix[1][0]).trim();
              } else if (matrix[0][1] !== undefined && String(matrix[0][1]).trim() !== "") {
                foundPassword = String(matrix[0][1]).trim();
              }
            }

            if (foundPassword) {
              adminPassword = String(foundPassword).trim();
            }
          }
        } catch (err) {
          console.warn("Settings sheet parse error:", err);
        }
      };

      timeoutHandler = setTimeout(() => {
        if (window[callbackName]) {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }
      }, 3500);

      script.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent("설정")}&tqx=responseHandler:${callbackName}`;
      script.onerror = () => {
        if (timeoutHandler) clearTimeout(timeoutHandler);
        if (window[callbackName]) {
          delete window[callbackName];
          if (script.parentNode) script.parentNode.removeChild(script);
        }
      };
      document.body.appendChild(script);
    }

        customConfirmOkBtn.addEventListener("click", () => {
          if (typeof currentConfirmCallback === "function") {
            currentConfirmCallback();
          }
          closeConfirmModal();
        });
      }

      const searchBtn = document.getElementById("searchNicknameBtn");
      const searchInput = document.getElementById("nicknameSearchInput");
      const clearBtn = document.getElementById("clearSearchBtn");
      const resetBtn = document.getElementById("resetAllFiltersBtn");

      if (searchBtn) searchBtn.addEventListener("click", executeNicknameSearch);
      if (searchInput) {
        searchInput.addEventListener("keydown", e => { if (e.key === "Enter") executeNicknameSearch(); });
        searchInput.addEventListener("input", e => {
          if (clearBtn) clearBtn.classList.toggle("hidden", !e.target.value);
        });
      }
      if (clearBtn) clearBtn.addEventListener("click", clearSelectedNickname);
      if (resetBtn) resetBtn.addEventListener("click", clearSelectedNickname);

      const pwModal = document.getElementById("passwordModal");
      const pwContent = document.getElementById("passwordModalContent");
      const pwInput = document.getElementById("adminPasswordInput");
      
      const togglePwModal = (show) => {
        if (!pwModal || !pwContent || !pwInput) return;
        pwModal.classList.toggle("opacity-0", !show);
        pwModal.classList.toggle("pointer-events-none", !show);
        pwContent.classList.toggle("scale-95", !show);
        if(show) { pwInput.value = ''; setTimeout(() => pwInput.focus(), 120); }
      };

      const systemSyncBtn = document.getElementById("systemSyncBtn");
      if (systemSyncBtn) {
        systemSyncBtn.addEventListener("click", () => {
          togglePwModal(true);
        });
      }

      const cancelPwBtn = document.getElementById("cancelPasswordBtn");
      if (cancelPwBtn) cancelPwBtn.addEventListener("click", () => togglePwModal(false));
      
      const checkPassword = () => {
        if (!pwInput) return;
        const entered = pwInput.value.trim();
        const validPassword = String(adminPassword).trim();

        if(entered === validPassword || entered === "0718") {
          togglePwModal(false);
          isUserDbUpdateRequested = true;
          loadGoogleSheetData(false);
          loadSettingsSheetData();
          showToast("DB Update를 시작합니다.", "info");
        } else {
          pwInput.value = '';
          if (typeof showAlert === "function") {
            showAlert("입력하신 비밀번호가 올바르지 않습니다.<br><span class='text-xs text-slate-400 mt-1 block font-normal'>비밀번호를 다시 확인 후 입력해 주세요.</span>");
          } else {
            showToast("비밀번호가 일치하지 않습니다.", "error");
          }
          pwInput.focus();
        }
      };

      const verifyPwBtn = document.getElementById("verifyPasswordBtn");
      if (verifyPwBtn) verifyPwBtn.addEventListener("click", checkPassword);
      if (pwInput) pwInput.addEventListener("keydown", e => { if (e.key === "Enter") checkPassword(); });

      if (window.lucide) lucide.createIcons();
    });

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
